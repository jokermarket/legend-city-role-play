<<!DOCTYPE html>
<html>

<title>LEGEND CITY 3D</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#000;color:#fff;overflow:hidden;height:100dvh}
#game{position:relative;width:100vw;height:100dvh}
canvas{display:block}
.hud{position:absolute;top:8px;left:8px;background:rgba(0,0,0,.8);padding:8px 10px;border-radius:10px;z-index:10}
.hud h1{font-size:20px}
.bar{height:8px;background:#333;border-radius:10px;overflow:hidden;margin-top:4px}
.fill{height:100%;background:#22c55e;width:100%}
.right{position:absolute;top:8px;right:8px;background:rgba(0,0,0,.8);padding:10px;border-radius:10px;z-index:10;font-size:11px}
.right h3{color:#facc15}
.chat{position:absolute;top:105px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.7);padding:6px 10px;border-radius:20px;font-size:10px;white-space:nowrap;z-index:10}
.pad{position:absolute;bottom:15px;left:15px;width:120px;height:120px;background:rgba(0,0,0,.4);border-radius:50%;border:2px solid #fff;z-index:10}
.pad button{position:absolute;width:40px;height:40px;border-radius:50%;background:#facc15;color:#000;font-weight:900;border:none}
.u{top:3px;left:40px}.d{bottom:3px;left:40px}.l{left:3px;top:40px}.r{right:3px;top:40px}
.btns{position:absolute;bottom:20px;right:10px;display:flex;gap:8px;z-index:10}
.btns button{padding:15px 14px;border-radius:12px;border:none;font-weight:900}
.run{background:#facc15}.car{background:#2563eb;color:#fff}
#label{position:absolute;bottom:150px;left:50%;transform:translateX(-50%);background:#000;padding:7px 12px;border-radius:20px;font-size:11px;font-weight:900;border:1px solid #facc15;z-index:10}
</style>
</head>
<body>
<div id="game">
<div class="hud"><h1 id="money">₦125,930 🪙</h1><div style="display:flex;justify-content:space-between;font-size:10px"><span>HEALTH</span><span>100%</span></div><div class="bar"><div class="fill"></div></div></div>
<div class="right"><h3>QUESTS</h3><p>• Deliver Package 0/1</p><h3 style="margin-top:6px">WEEKLY</h3><p>• 3/5 Robberies</p><h3 style="margin-top:6px">CITY PASS</h3><p>Lv.12 150/500 XP</p></div>
<div class="chat"><b style="color:#facc15">GAME CHAT:</b> Adams: Need backup at Yaba!</div>
<div id="label">👤 GANGSTER - Lekki Hall</div>
<div class="pad"><button class="u" onmousedown="startMove(0,1)" onmouseup="stopMove()" ontouchstart="startMove(0,1)" ontouchend="stopMove()">⬆️</button><button class="d" onmousedown="startMove(0,-1)" onmouseup="stopMove()" ontouchstart="startMove(0,-1)" ontouchend="stopMove()">⬇️</button><button class="l" onmousedown="startMove(-1,0)" onmouseup="stopMove()" ontouchstart="startMove(-1,0)" ontouchend="stopMove()">⬅️</button><button class="r" onmousedown="startMove(1,0)" onmouseup="stopMove()" ontouchstart="startMove(1,0)" ontouchend="stopMove()">➡️</button></div>
<div class="btns"><button class="run" onclick="doRun()">🏃 RUN</button><button class="car" onclick="alert('Go outside for car! This na hall.') ">🚗 CAR</button></div>
</div>
